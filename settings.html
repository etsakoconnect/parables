<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Maintenance</title>
  <style>
    :root {
      --bg-color: #0d1412;
      --card-bg: rgba(18, 28, 25, 0.85);
      --accent-orange: #ff5722;
      --accent-green: #2ecc71;
      --accent-yellow: #f1c40f;
      --accent-blue: #3498db;
      --text-muted: #8fa399;
      --text-light: #e0ece6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(46, 204, 113, 0.05), transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(0, 0, 0, 0.8), var(--bg-color));
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      max-width: 450px;
      width: 100%;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 40px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    /* Top Logo Header */
    .logo-container {
      width: 90px;
      height: 90px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    /* Status Indicator */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-orange);
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-orange);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-orange);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Title & Board Name */
    .organization-name {
      font-size: 12px;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      line-height: 1.5;
      margin-bottom: 30px;
      font-weight: 600;
    }

    /* Animated Gears Icon Row */
    .icons-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 30px;
    }

    .gear-icon {
      width: 32px;
      height: 32px;
      fill: currentColor;
    }

    .gear-green { color: var(--accent-green); animation: spin 8s linear infinite; }
    .gear-yellow { color: var(--accent-yellow); animation: spin-reverse 6s linear infinite; }
    .gear-orange { color: var(--accent-orange); animation: spin 7s linear infinite; }
    .gear-blue { color: var(--accent-blue); animation: spin-reverse 9s linear infinite; }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Main Heading & Content */
    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    p {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 400;
    }
  </style>
</head>
